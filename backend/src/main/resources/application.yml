server:
  port: 8080

  # 같은 네트워크의 다른 PC에서도 접근 가능하게 함
  address: 0.0.0.0

spring:
  application:
    name: doenaai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

    hibernate:
      # DB는 Supabase migration SQL로 관리
      # Hibernate가 임의로 생성/수정하지 않음
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: public
        format_sql: true

        jdbc:
          time_zone: UTC

logging:
  level:
    org.springframework.security: DEBUG

doenaai:
  security:
    credential-encryption-key: ${DOENAAI_CREDENTIAL_ENCRYPTION_KEY:}
  ai-server:
    base-url: ${DOENAAI_AI_BASE_URL:http://localhost:8000}
    internal-api-key: ${DOENAAI_AI_INTERNAL_API_KEY:}
    # 일반 분석과 DB 분석이 각각 최대 한 번 재시도하는 4회의 모델 호출을 기다린다.
    timeout-seconds: ${DOENAAI_AI_TIMEOUT_SECONDS:3900}
  analysis:
    worker-enabled: ${DOENAAI_ANALYSIS_WORKER_ENABLED:true}
    max-prompt-chars: ${DOENAAI_ANALYSIS_MAX_PROMPT_CHARS:90000}
    poll-delay-ms: ${DOENAAI_ANALYSIS_POLL_DELAY_MS:2500}
    stale-timeout-seconds: ${DOENAAI_ANALYSIS_STALE_TIMEOUT_SECONDS:4500}
  git:
    connection-timeout-seconds: ${DOENAAI_GIT_CONNECTION_TIMEOUT_SECONDS:10}
