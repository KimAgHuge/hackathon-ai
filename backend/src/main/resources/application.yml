server:
  port: 8080

  # 같은 네트워크의 다른 PC에서도 접근 가능하게 함
  address: 0.0.0.0

spring:
  application:
    name: doenaai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

    hibernate:
      # DB는 Supabase migration SQL로 관리
      # Hibernate가 임의로 생성/수정하지 않음
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: public
        format_sql: true

        jdbc:
          time_zone: UTC

logging:
  level:
    org.springframework.security: DEBUG